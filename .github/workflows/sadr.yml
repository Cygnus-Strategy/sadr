# Cygnus Strategy's own Sadr run, from the Sadr repo itself. It runs this
# commit of Sadr on an owner the sadrbot App is installed on. Adopters use
# examples/sadr-org.yml instead.
name: Sadr

on:
  # Weekly, Saturday night in Dallas: 04:00 UTC Sunday is 11 pm CDT, or 10 pm CST in winter.
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      owner:
        description: The organization or user account to run on.
        type: string
        default: Cygnus-Strategy
      repos:
        description: Only these repos, by name, separated by spaces. Empty means every repo.
        type: string
        default: ""
      preview:
        description: Do the whole run but push nothing.
        type: boolean
        default: true

# The App token does the writing. This repo's own token only reads Sadr.
permissions:
  contents: read
  id-token: write

jobs:
  # A run started by hand: one owner, preview by default.
  sadr:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/org.yml
    with:
      sadr-ref: ${{ github.sha }}
      owner: ${{ inputs.owner }}
      repos: ${{ inputs.repos }}
      preview: ${{ inputs.preview }}
      model: claude-opus-5-5
      max-spend-usd: 200
      max-parallel: 4
    secrets:
      app_id: ${{ secrets.SADR_APP_ID }}
      app_private_key: ${{ secrets.SADR_APP_PRIVATE_KEY }}
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      semgrep_app_token: ${{ secrets.SEMGREP_APP_TOKEN }}

  # The weekly run: every repo of both owners, for real. One owner at a time,
  # so that the two runs do not share the Claude subscription at once.
  weekly:
    if: github.event_name == 'schedule'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        owner: [Cygnus-Strategy, pid1]
    uses: ./.github/workflows/org.yml
    with:
      sadr-ref: ${{ github.sha }}
      owner: ${{ matrix.owner }}
      preview: false
      model: claude-opus-5-5
      max-spend-usd: 200
      max-parallel: 4
    secrets:
      app_id: ${{ secrets.SADR_APP_ID }}
      app_private_key: ${{ secrets.SADR_APP_PRIVATE_KEY }}
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      semgrep_app_token: ${{ secrets.SEMGREP_APP_TOKEN }}
