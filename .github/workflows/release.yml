# Publishes a signed release when a v* tag is pushed. The source archive
# gets a keyless Sigstore provenance attestation from GitHub, and the
# release carries the bundle, so anyone can check it with
# `gh attestation verify sadr-TAG.tar.gz --repo Cygnus-Strategy/sadr`.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the source archive
        env:
          TAG: ${{ github.ref_name }}
        run: git archive --format=tar.gz --prefix="sadr-$TAG/" -o "sadr-$TAG.tar.gz" "$TAG"

      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sadr-${{ github.ref_name }}.tar.gz

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "sadr-$TAG.tar.gz.sigstore.json"
          sha256sum "sadr-$TAG.tar.gz" > "sadr-$TAG.tar.gz.sha256"
          notes=$(awk -v tag="## $TAG" '$0 ~ "^## " { on = index($0, tag) == 1; next } on' CHANGELOG.md)
          gh release create "$TAG" --verify-tag --title "Sadr $TAG" --notes "${notes:-See CHANGELOG.md.}" \
            "sadr-$TAG.tar.gz" "sadr-$TAG.tar.gz.sigstore.json" "sadr-$TAG.tar.gz.sha256"
