# Copy this file to .github/workflows/sadr.yml in the owner's .github repo.
# It runs Sadr on every repo of the organization or user account. Replace
# SHA, in both places, with the full commit SHA of the Sadr release in the
# comment. Sadr's upkeep PR moves both to newer releases after the cooldown.
#
# Sadr acts as your own copy of the Sadr GitHub App, installed on the
# owner. Create it from app/manifest.json as app/README.md says, and store
# its ID and private key as the SADR_APP_ID and SADR_APP_PRIVATE_KEY
# secrets.
name: Sadr

on:
  schedule: [{cron: "17 3 * * *"}]   # any cadence: this one is nightly
  workflow_dispatch:
    inputs:
      preview: {type: boolean, default: false}

# The App token does the writing. This repo's own token only reads.
permissions:
  contents: read
  # Only workload identity federation uses this.
  id-token: write

jobs:
  sadr:
    uses: Cygnus-Strategy/sadr/.github/workflows/org.yml@SHA # v1.0.0
    with:
      sadr-ref: SHA
      preview: ${{ inputs.preview || false }}
      # The Claude model for the run. The workflow picks it before Sadr reads
      # AGENTS.md, so it is set here and not in Settings.
      model: claude-opus-5-5
      max-spend-usd: 200
      max-parallel: 4
    secrets:
      app_id: ${{ secrets.SADR_APP_ID }}
      app_private_key: ${{ secrets.SADR_APP_PRIVATE_KEY }}
      # Set one: a subscription token (`claude setup-token`) or an API key.
      # For workload identity federation, set the federation-rule-id and
      # organization-id inputs under `with:` instead.
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      semgrep_app_token: ${{ secrets.SEMGREP_APP_TOKEN }}
